<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NAME}} — CV</title>
<style>
  @font-face {
    font-family: 'Space Grotesk';
    src: url('./fonts/space-grotesk-latin.woff2') format('woff2');
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'DM Sans';
    src: url('./fonts/dm-sans-latin.woff2') format('woff2');
    font-weight: 100 1000;
    font-style: normal;
    font-display: swap;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    line-height: 1.4;
    color: #333;
    background: #ffffff;
    padding: 0;
    margin: 0;
  }

  .page {
    width: 100%;
    max-width: {{PAGE_WIDTH}};
    margin: 0 auto;
    padding: 0;
  }

  /* === HEADER === */
  .header {
    text-align: center;
    margin-bottom: 20px;
  }

  .header h1 {
    font-family: 'DM Sans', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: #4A90E2;
    margin-bottom: 8px;
  }

  .contact-line {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: #333;
    margin-bottom: 10px;
  }

  .name-tag {
    background: #f1f1f1;
    color: #4A90E2;
    padding: 2px 10px;
    border-radius: 4px;
    font-weight: 600;
  }

  .contact-separator {
    color: #666;
  }

  .social-links {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 5px;
  }

  .social-link {
    display: flex;
    align-items: center;
    gap: 5px;
    text-decoration: none;
    color: #4A90E2;
    font-size: 12px;
  }

  .social-link svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  /* === SECTIONS === */
  .section {
    margin-bottom: 15px;
  }

  .section-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    color: #4A90E2;
    border-bottom: 1px solid #333;
    padding-bottom: 2px;
    margin-bottom: 10px;
  }

  /* === SKILLS === */
  .skills-list {
    list-style: none;
    padding-left: 5px;
  }

  .skills-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 5px;
    font-weight: 600;
    font-size: 11.5px;
  }

  .skills-list li::before {
    content: "❖";
    color: #333;
    font-size: 10px;
    margin-top: 2px;
  }

  /* === WORK EXPERIENCE & PROJECTS === */
  .item {
    margin-bottom: 12px;
  }

  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }

  .item-title {
    font-weight: 700;
    font-size: 12px;
  }

  .item-subtitle {
    font-weight: 400;
    color: #555;
    font-size: 11px;
  }

  .item-date {
    font-size: 11px;
    color: #666;
    font-style: italic;
  }

  .item-bullets {
    list-style: disc;
    padding-left: 18px;
    margin-top: 4px;
  }

  .item-bullets li {
    margin-bottom: 3px;
    font-size: 11px;
    line-height: 1.4;
  }

  /* === EDUCATION === */
  .edu-item {
    margin-bottom: 8px;
  }

  .edu-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .edu-main {
    font-weight: 700;
  }

  .edu-score {
    font-weight: 600;
  }

  /* === PRINT === */
  @media print {
    body {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      padding: 0;
    }
  }

  .avoid-break {
    break-inside: avoid;
    page-break-inside: avoid;
  }
</style>
</head>
<body>
<div class="page">

  <!-- HEADER -->
  <div class="header avoid-break">
    <h1>{{NAME}}</h1>
    <div class="contact-line">
      <span class="name-tag">{{NAME}}</span>
      <span class="contact-separator">|</span>
      <span>{{PHONE}}</span>
      <span class="contact-separator">|</span>
      <a href="{{PORTFOLIO_URL}}" style="text-decoration: none; color: inherit;">Website</a>
    </div>
    <div class="social-links">
      <a href="{{GITHUB_URL}}" class="social-link">
        <svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        {{GITHUB_DISPLAY}}
      </a>
      <a href="{{LINKEDIN_URL}}" class="social-link">
        <svg viewBox="0 0 24 24"><path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.238 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/></svg>
        {{LINKEDIN_DISPLAY}}
      </a>
    </div>
  </div>

  <!-- SKILLS -->
  <div class="section avoid-break">
    <div class="section-title">SKILLS</div>
    <ul class="skills-list">
      {{SKILLS}}
    </ul>
  </div>

  <!-- EDUCATION -->
  <div class="section">
    <div class="section-title">EDUCATION</div>
    {{EDUCATION}}
  </div>

  <!-- EXPERIENCE -->
  <div class="section">
    <div class="section-title">EXPERIENCE</div>
    {{EXPERIENCE}}
  </div>

  <!-- ACADEMIC PROJECTS -->
  <div class="section">
    <div class="section-title">ACADEMIC PROJECTS</div>
    {{PROJECTS}}
  </div>

  <!-- ACHIEVEMENTS -->
  <div class="section avoid-break">
    <div class="section-title">ACHIEVEMENTS</div>
    {{ACHIEVEMENTS}}
  </div>

</div>
</body>
</html>
